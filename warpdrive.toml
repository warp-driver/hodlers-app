# Warpdrive node config for hodlers-app.
#
# Watches Phoenix XLM-USDC swaps on stellar:pubnet, signs envelopes with the
# operator's HD-derived ed25519 key, and submits via quorum to the
# stellar-handler on stellar:testnet.
#
# This file is intended to live ALSO on each operator's box (e.g.
# /root/hodlers-app/warpdrive.toml). The only per-operator difference is the
# `[warpdrive.p2p.remote]` block — see the section below.

[default]
log_level = ["info", "warpdrive=debug"]

[default.chains.stellar.pubnet]
chain_poll_interval_ms = 5000
rpc_url = "https://mainnet.sorobanrpc.com"
network_passphrase = "Public Global Stellar Network ; September 2015"

[default.chains.stellar.testnet]
chain_poll_interval_ms = 5000
rpc_url = "https://soroban-testnet.stellar.org"
network_passphrase = "Test SDF Network ; September 2015"
friendbot_url = "https://friendbot-testnet.stellar.org/"

[warpdrive]
port = 8000
dev_endpoints_enabled = true
# Pinata's gateway resolves CIDs pinned via `task pin-service` fast and
# reliably. Override if you self-host an IPFS gateway.
ipfs_gateway = "https://gateway.pinata.cloud/ipfs/"

# ── P2P ────────────────────────────────────────────────────────────────
# Per-operator config. Three operators, all on Hetzner Falkenstein:
#   operator-1  178.105.192.249    (bootstrap)
#   operator-2  178.105.196.203
#   operator-3  178.105.207.158
#
# Each operator's libp2p peer_id is deterministic — derived from
# WARPDRIVE_SIGNING_MNEMONIC at HD path m/44'/60'/0'/0/0
# (see packages/warpdrive/src/subsystems/aggregator/p2p.rs:keypair_from_mnemonic).
# So the peer_id is stable across restarts. Compute offline with
# `scripts/peer-id-from-mnemonic` or read it from the first run's log:
#     "Using P2P identity derived from signing_mnemonic (peer_id: 12D3KooW...)"
#
# ── operator-1 (bootstrap) ─────────────────────────────────────────────
[warpdrive.p2p.remote]
listen_port = 9000
# Empty list = this node is a bootstrap server. operator-1 stays empty.
bootstrap_nodes = []
#
# ── operator-2 and operator-3 ──────────────────────────────────────────
# Replace the section above with:
#
# [warpdrive.p2p.remote]
# listen_port = 9000
# bootstrap_nodes = [
#     "/ip4/178.105.192.249/tcp/9000/p2p/<operator-1-peer-id>",
#     # Optional but recommended: the other peer too, for resilience if
#     # operator-1 goes down. On operator-2 list operator-3, and vice
#     # versa.
# ]

[cli]

[cli.chains.stellar.pubnet]
chain_poll_interval_ms = 5000
rpc_url = "https://mainnet.sorobanrpc.com"
network_passphrase = "Public Global Stellar Network ; September 2015"

[cli.chains.stellar.testnet]
chain_poll_interval_ms = 5000
rpc_url = "https://soroban-testnet.stellar.org"
network_passphrase = "Test SDF Network ; September 2015"
friendbot_url = "https://friendbot-testnet.stellar.org/"
