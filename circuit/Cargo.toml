[package]
name = "hodlers-circuit"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52" }
alloy-sol-types = "1.4.1"
alloy-primitives = { version = "1.4.1", features = ["serde"] }

# After `scripts/fetch-wit.sh` populates `../wit-definitions/`, add
# `wit-bindgen-rt` here and configure `package.metadata.component.target`
# to point at the cloned WIT world. Until then this crate is a plain
# `cdylib` placeholder that won't link with the WarpDrive host.
[package.metadata.component]
package = "hodlers-app:circuit"

[profile.release]
opt-level = "s"
lto = true
