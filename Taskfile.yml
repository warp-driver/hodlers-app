version: '3'

tasks:
  fetch-wit:
    desc: Fetch warpdrive WIT dependencies into wit-definitions/deps/.
    cmds:
      - cd wit-definitions && wkg wit fetch

  build-circuit:
    desc: Build hodlers-circuit as a WASI 0.2 component.
    cmds:
      - cargo component build --release --manifest-path circuit/Cargo.toml

  build-hodlers:
    desc: Build hodlers Soroban contract.
    cmds:
      - cd contracts/hodlers && stellar contract build --optimize

  test-hodlers:
    desc: Run hodlers contract unit tests.
    cmds:
      - cargo test --manifest-path contracts/hodlers/Cargo.toml --lib

  build-handler:
    desc: Build stellar-handler Soroban contract.
    cmds:
      - cd contracts/stellar-handler && stellar contract build --optimize

  test-handler:
    desc: Run stellar-handler contract unit tests.
    cmds:
      - cargo test --manifest-path contracts/stellar-handler/Cargo.toml --lib

  build-security:
    desc: Build secp256k1-security Soroban contract.
    cmds:
      - cd contracts/secp256k1-security && stellar contract build --optimize

  build-verification:
    desc: Build secp256k1-verification Soroban contract.
    cmds:
      - cd contracts/secp256k1-verification && stellar contract build --optimize

  build-contracts:
    desc: Build all Soroban contracts.
    deps: [build-security, build-verification, build-hodlers, build-handler]

  test-contracts:
    desc: Run all Soroban contract tests.
    deps: [test-hodlers, test-handler]
