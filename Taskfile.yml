version: '3'

# Environment variables consumed by deploy tasks (override on the command line
# or via .env loaded by your shell):
#
#   DEPLOYER_SECRET      Stellar S-seed used as `--source` everywhere — host
#                        `stellar contract deploy` AND the middleware container.
#                        Required. Bootstrap (testnet):
#                          stellar keys generate hodlers-deployer --fund --network testnet
#                          export DEPLOYER_SECRET=$(stellar keys show hodlers-deployer)
#                          export DEPLOYER_ADDRESS=$(stellar keys address hodlers-deployer)
#   DEPLOYER_ADDRESS     G-address matching DEPLOYER_SECRET. Required by middleware.
#   RPC_URL              Stellar Soroban RPC. Default: testnet.
#   NETWORK_PASSPHRASE   Stellar network passphrase. Default: testnet.
#   PHOENIX_POOL         Soroban C-address of the Phoenix XLM-USDC pool.
#                        Default: the address recorded with the test swap.
#   TRIGGER_CHAIN        WarpDrive chain key the circuit watches for events.
#                        Default: stellar:pubnet (real Phoenix lives only on mainnet).
#   MANAGER_CHAIN        WarpDrive chain key the handler is deployed on.
#                        Default: stellar:testnet (matches the RPC defaults above).
#   WORKFLOW_ID          Service workflow id. Default: swap.
#   SIGNER_PUBKEY        secp256k1 operator pubkey (33-byte compressed, hex) to
#                        register on the security contract. No default.
#   SIGNER_WEIGHT        Operator weight on the security contract. Default: 100.
#   THRESHOLD_NUM        Consensus numerator. Default: 1.
#   THRESHOLD_DEN        Consensus denominator. Default: 1.
#
# Artefacts produced under ./out/ (gitignored):
#
#   out/deploy.json      Middleware-produced manifest: secp256k1_security,
#                        secp256k1_verification, ethereum_handler, project_root.
#   out/hodlers.json     Our hodlers contract address.
#   out/handler.json     Our stellar-handler contract address.
#   out/circuit.uri      URI emitted by `warpdrive-cli upload-component`.
#   out/aggregator.uri   URI emitted by `warpdrive-cli upload-component`.

vars:
  RPC_URL: '{{.RPC_URL | default "https://soroban-testnet.stellar.org"}}'
  NETWORK_PASSPHRASE: '{{.NETWORK_PASSPHRASE | default "Test SDF Network ; September 2015"}}'
  PHOENIX_POOL: '{{.PHOENIX_POOL | default "CBHCRSVX3ZZ7EGTSYMKPEFGZNWRVCSESQR3UABET4MIW52N4EVU6BIZX"}}'
  TRIGGER_CHAIN: '{{.TRIGGER_CHAIN | default "stellar:pubnet"}}'
  MANAGER_CHAIN: '{{.MANAGER_CHAIN | default "stellar:testnet"}}'
  WORKFLOW_ID: '{{.WORKFLOW_ID | default "swap"}}'
  SIGNER_WEIGHT: '{{.SIGNER_WEIGHT | default "100"}}'
  THRESHOLD_NUM: '{{.THRESHOLD_NUM | default "1"}}'
  THRESHOLD_DEN: '{{.THRESHOLD_DEN | default "1"}}'
  MIDDLEWARE_IMAGE: '{{.MIDDLEWARE_IMAGE | default "ghcr.io/warp-driver/warpdrive-stellar-middleware:latest"}}'
  CIRCUIT_WASM: components/circuit/target/wasm32-wasip1/release/hodlers_circuit.wasm
  AGGREGATOR_WASM: components/aggregator/target/wasm32-wasip1/release/hodlers_aggregator.wasm
  SERVICE_FILE: '{{.SERVICE_FILE | default "service/service.json"}}'

tasks:
  fetch-wit:
    desc: Fetch warpdrive WIT dependencies into wit-definitions/deps/.
    cmds:
      - cd wit-definitions && wkg wit fetch

  build-circuit:
    desc: Build hodlers-circuit as a WASI 0.2 component.
    cmds:
      - cargo component build --release --manifest-path components/circuit/Cargo.toml

  build-aggregator:
    desc: Build hodlers-aggregator as a WASI 0.2 component.
    cmds:
      - cargo component build --release --manifest-path components/aggregator/Cargo.toml

  test-circuit:
    desc: Run hodlers-circuit unit tests.
    cmds:
      - cargo test --manifest-path components/circuit/Cargo.toml --lib

  build-hodlers:
    desc: Build hodlers Soroban contract.
    cmds:
      - cd contracts/hodlers && stellar contract build --optimize

  test-hodlers:
    desc: Run hodlers contract unit tests.
    cmds:
      - cargo test --manifest-path contracts/hodlers/Cargo.toml --lib

  build-handler:
    desc: Build stellar-handler Soroban contract.
    cmds:
      - cd contracts/stellar-handler && stellar contract build --optimize

  test-handler:
    desc: Run stellar-handler contract unit tests.
    cmds:
      - cargo test --manifest-path contracts/stellar-handler/Cargo.toml --lib

  build-security:
    desc: Build secp256k1-security Soroban contract.
    cmds:
      - cd contracts/secp256k1-security && stellar contract build --optimize

  build-verification:
    desc: Build secp256k1-verification Soroban contract.
    cmds:
      - cd contracts/secp256k1-verification && stellar contract build --optimize

  build-contracts:
    desc: Build all Soroban contracts.
    deps: [build-security, build-verification, build-hodlers, build-handler]

  test-contracts:
    desc: Run all Soroban contract tests.
    deps: [test-hodlers, test-handler]

  build-service:
    desc: |
      Build service.json declaratively via warpdrive-cli. Requires
      out/handler.json (from `task deploy-handler`) and uploaded component
      URIs at out/circuit.uri and out/aggregator.uri.
    deps: [build-circuit]
    cmds:
      - mkdir -p service
      - rm -f {{.SERVICE_FILE}}
      - |
        set -euo pipefail
        HANDLER=$(jq -r .stellar_handler out/handler.json)
        CIRCUIT_URI=$(cat out/circuit.uri)
        AGG_URI=$(cat out/aggregator.uri)
        warpdrive-cli service -f {{.SERVICE_FILE}} init --name hodlers
        warpdrive-cli service -f {{.SERVICE_FILE}} workflow add --id {{.WORKFLOW_ID}}
        warpdrive-cli service -f {{.SERVICE_FILE}} workflow trigger \
            --id {{.WORKFLOW_ID}} set-stellar \
            --contract-id {{.PHOENIX_POOL}} \
            --chain {{.TRIGGER_CHAIN}} \
            --topic string:swap \
            --topic wildcard
        warpdrive-cli service -f {{.SERVICE_FILE}} workflow component \
            --id {{.WORKFLOW_ID}} set-source-uri --uri "$CIRCUIT_URI"
        warpdrive-cli service -f {{.SERVICE_FILE}} workflow submit \
            --id {{.WORKFLOW_ID}} set-aggregator
        warpdrive-cli service -f {{.SERVICE_FILE}} workflow submit \
            --id {{.WORKFLOW_ID}} component set-source-uri --uri "$AGG_URI"
        warpdrive-cli service -f {{.SERVICE_FILE}} manager set-stellar \
            --chain {{.MANAGER_CHAIN}} --address "$HANDLER"

  upload-component:
    desc: Upload the circuit wasm via warpdrive-cli; writes URI to out/circuit.uri.
    deps: [build-circuit]
    cmds:
      - mkdir -p out
      - warpdrive-cli upload-component {{.CIRCUIT_WASM}} | tee out/circuit.upload.log
      - |
        grep -Eo '(ipfs://[A-Za-z0-9]+|https?://\S+|registry://\S+)' out/circuit.upload.log \
          | tail -n 1 > out/circuit.uri
        test -s out/circuit.uri || { echo "no URI captured from upload-component output"; exit 1; }

  upload-aggregator:
    desc: Upload the hodlers-aggregator wasm; writes URI to out/aggregator.uri.
    deps: [build-aggregator]
    cmds:
      - mkdir -p out
      - warpdrive-cli upload-component {{.AGGREGATOR_WASM}} | tee out/aggregator.upload.log
      - |
        grep -Eo '(ipfs://[A-Za-z0-9]+|https?://\S+|registry://\S+)' out/aggregator.upload.log \
          | tail -n 1 > out/aggregator.uri
        test -s out/aggregator.uri || { echo "no URI captured from upload-component output"; exit 1; }

  deploy-middleware:
    desc: |
      Deploy secp256k1 pipeline + project-root via warpdrive-stellar-middleware
      using your DEPLOYER_SECRET (BYOK). Writes out/deploy.json.
    cmds:
      - mkdir -p out
      - |
        set -euo pipefail
        : "${DEPLOYER_SECRET:?DEPLOYER_SECRET is required}"
        : "${DEPLOYER_ADDRESS:?DEPLOYER_ADDRESS is required}"
        docker run --rm \
          --pull=always \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e RPC_URL="{{.RPC_URL}}" \
          -e NETWORK_PASSPHRASE="{{.NETWORK_PASSPHRASE}}" \
          -e DEPLOYER_SECRET="$DEPLOYER_SECRET" \
          -e DEPLOYER_ADDRESS="$DEPLOYER_ADDRESS" \
          -v "$PWD/out:/out" \
          {{.MIDDLEWARE_IMAGE}} \
          /warpdrive/cli.sh deploy --output-path /out/deploy.json --variant ethereum

  deploy-hodlers:
    desc: Deploy the hodlers contract using DEPLOYER_SECRET. Writes out/hodlers.json.
    deps: [build-hodlers]
    cmds:
      - mkdir -p out
      - |
        set -euo pipefail
        : "${DEPLOYER_SECRET:?DEPLOYER_SECRET is required}"
        HODLERS_ADDR=$(stellar contract deploy \
            --wasm contracts/hodlers/target/wasm32v1-none/release/hodlers.wasm \
            --rpc-url "{{.RPC_URL}}" \
            --network-passphrase "{{.NETWORK_PASSPHRASE}}" \
            --source "$DEPLOYER_SECRET")
        echo "{\"hodlers\":\"$HODLERS_ADDR\"}" | jq . > out/hodlers.json
        cat out/hodlers.json

  deploy-handler:
    desc: |
      Deploy stellar-handler using DEPLOYER_SECRET. Reads verification contract
      from out/deploy.json and hodlers contract from out/hodlers.json. Writes
      out/handler.json.
    deps: [build-handler]
    cmds:
      - mkdir -p out
      - |
        set -euo pipefail
        : "${DEPLOYER_SECRET:?DEPLOYER_SECRET is required}"
        VERIFICATION=$(jq -r .contracts.secp256k1_verification out/deploy.json)
        HODLERS=$(jq -r .hodlers out/hodlers.json)
        HANDLER_ADDR=$(stellar contract deploy \
            --wasm contracts/stellar-handler/target/wasm32v1-none/release/stellar_handler.wasm \
            --rpc-url "{{.RPC_URL}}" \
            --network-passphrase "{{.NETWORK_PASSPHRASE}}" \
            --source "$DEPLOYER_SECRET" \
            -- \
            --verification_contract "$VERIFICATION" \
            --hodlers_contract "$HODLERS")
        echo "{\"stellar_handler\":\"$HANDLER_ADDR\"}" | jq . > out/handler.json
        cat out/handler.json

  run-node:
    desc: |
      Run a single-operator warpdrive node locally using the warpdrive.toml in
      this repo. Requires WARPDRIVE_SIGNING_MNEMONIC (a BIP39 phrase or 0x-hex
      raw secp256k1 secret) and DEPLOYER_SECRET (the testnet ed25519 S-seed,
      reused as the Stellar aggregator credential). Long-lived; run in its own
      terminal.
    cmds:
      - mkdir -p out/node-data
      - |
        set -euo pipefail
        : "${WARPDRIVE_SIGNING_MNEMONIC:?WARPDRIVE_SIGNING_MNEMONIC is required}"
        : "${DEPLOYER_SECRET:?DEPLOYER_SECRET is required (used as WARPDRIVE_AGGREGATOR_STELLAR_CREDENTIAL)}"
        WARPDRIVE_HOME="$PWD" \
        WARPDRIVE_DATA="$PWD/out/node-data" \
        WARPDRIVE_AGGREGATOR_STELLAR_CREDENTIAL="${WARPDRIVE_AGGREGATOR_STELLAR_CREDENTIAL:-$DEPLOYER_SECRET}" \
        warpdrive

  operator-pubkey:
    desc: |
      Print the 33-byte SEC1-compressed secp256k1 pubkey for WARPDRIVE_SIGNING_MNEMONIC
      (which may also be a 0x-prefixed raw secp256k1 hex secret). Use as
      SIGNER_PUBKEY for `task register-signer`.
    cmds:
      - cargo run --quiet --manifest-path scripts/operator-pubkey/Cargo.toml

  register-signer:
    desc: |
      Register a secp256k1 signer (operator pubkey) on the security contract
      and set the consensus threshold. Requires SIGNER_PUBKEY env var.
    cmds:
      - |
        set -euo pipefail
        : "${DEPLOYER_SECRET:?DEPLOYER_SECRET is required}"
        : "${DEPLOYER_ADDRESS:?DEPLOYER_ADDRESS is required}"
        : "${SIGNER_PUBKEY:?SIGNER_PUBKEY is required}"
        docker run --rm \
          --pull=always \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e RPC_URL="{{.RPC_URL}}" \
          -e NETWORK_PASSPHRASE="{{.NETWORK_PASSPHRASE}}" \
          -e DEPLOYER_SECRET="$DEPLOYER_SECRET" \
          -e DEPLOYER_ADDRESS="$DEPLOYER_ADDRESS" \
          -v "$PWD/out:/out" \
          {{.MIDDLEWARE_IMAGE}} \
          /warpdrive/cli.sh add-signer \
            --scheme secp256k1 \
            --key "$SIGNER_PUBKEY" \
            --weight {{.SIGNER_WEIGHT}} \
            --deploy-file /out/deploy.json
        docker run --rm \
          --pull=always \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e RPC_URL="{{.RPC_URL}}" \
          -e NETWORK_PASSPHRASE="{{.NETWORK_PASSPHRASE}}" \
          -e DEPLOYER_SECRET="$DEPLOYER_SECRET" \
          -e DEPLOYER_ADDRESS="$DEPLOYER_ADDRESS" \
          -v "$PWD/out:/out" \
          {{.MIDDLEWARE_IMAGE}} \
          /warpdrive/cli.sh set-threshold \
            --scheme secp256k1 \
            --numerator {{.THRESHOLD_NUM}} \
            --denominator {{.THRESHOLD_DEN}} \
            --deploy-file /out/deploy.json

  set-service-spec:
    desc: |
      Point the on-chain project-root at the deployed service.json. Requires
      SERVICE_URI env var (e.g. ipfs://... after you've pinned service.json).
    cmds:
      - |
        set -euo pipefail
        : "${DEPLOYER_SECRET:?DEPLOYER_SECRET is required}"
        : "${DEPLOYER_ADDRESS:?DEPLOYER_ADDRESS is required}"
        : "${SERVICE_URI:?SERVICE_URI is required}"
        docker run --rm \
          --pull=always \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e RPC_URL="{{.RPC_URL}}" \
          -e NETWORK_PASSPHRASE="{{.NETWORK_PASSPHRASE}}" \
          -e DEPLOYER_SECRET="$DEPLOYER_SECRET" \
          -e DEPLOYER_ADDRESS="$DEPLOYER_ADDRESS" \
          -v "$PWD/out:/out" \
          {{.MIDDLEWARE_IMAGE}} \
          /warpdrive/cli.sh set-project-spec-repo \
            --repo "$SERVICE_URI" \
            --deploy-file /out/deploy.json

  deploy-contracts:
    desc: Deploy all on-chain contracts (middleware + hodlers + handler).
    cmds:
      - task: deploy-middleware
      - task: deploy-hodlers
      - task: deploy-handler

  deploy:
    desc: |
      Phase 1 (no node required): build everything + deploy on-chain contracts.
      After this completes, start the node (`task run-node` in another terminal),
      then run `task wire-service` to upload components and assemble service.json.
    cmds:
      - task: build-contracts
      - task: build-circuit
      - task: build-aggregator
      - task: deploy-contracts

  wire-service:
    desc: |
      Phase 2 (requires `task run-node` running in another terminal): upload
      both wasms to the node, then assemble service/service.json. After this,
      pin service.json and run `task set-service-spec SERVICE_URI=...` plus
      `task register-signer SIGNER_PUBKEY=...`.
    cmds:
      - task: upload-component
      - task: upload-aggregator
      - task: build-service
