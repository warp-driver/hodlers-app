[package]
name = "hodlers-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "26", features = ["alloc"] }
alloy-sol-types = "1.4.1"
alloy-primitives = { version = "1.4.1", features = ["serde"] }

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }

[profile.release]
overflow-checks = true
